name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Remover rotas que exigem servidor
        run: rm -rf src/app/api

      - run: npm run build
        env:
          STATIC_EXPORT: true
          NEXTAUTH_SECRET: placeholder
          NEXTAUTH_URL: https://alexandrerodriguesstrapasson.github.io/E-commerce

      - name: Adicionar .nojekyll
        run: touch out/.nojekyll

      - name: Deploy para gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
